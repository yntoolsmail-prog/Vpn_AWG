# modules.conf — управление модулями AmneziaWG Bot
# Формат: <module_name>=on|off
# Закомментированные строки (# ...) и пустые строки игнорируются.
# Имена модулей соответствуют подпапкам в директории modules/.
# Комментарий над строкой модуля используется как описание в setup.sh --modules.

# Базовый модуль (всегда активен)
bot=on

# Веб-панель TMA (Telegram Mini App) — требует домена + HTTPS + nginx
tma=off
# Прокси Telegram — MTProxy сервер, ссылка на подключение для всех пользователей
mtproxy=on
# SOCKS5 маршрутизация — направить VPN-клиента через внешний SOCKS5 прокси
socks5=on
# Управление slave-серверами — добавление secondary VPS через SSH
slave_servers=on
