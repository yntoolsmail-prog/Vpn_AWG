<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>AWG Monitor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;700;800&display=swap');

  :root {
    --bg: #0a0c0f;
    --surface: #111418;
    --surface2: #181d24;
    --border: #1e2530;
    --border-glow: #2a3545;
    --green: #00e676;
    --green-dim: #00e67622;
    --green-mid: #00e67644;
    --blue: #40c4ff;
    --blue-dim: #40c4ff22;
    --amber: #ffab00;
    --amber-dim: #ffab0022;
    --red: #ff5252;
    --red-dim: #ff525222;
    --text: #c8d6e5;
    --text-dim: #5a6a7a;
    --text-mid: #8a9baa;
    --accent: #00e676;
    --glow: 0 0 20px #00e67633;
    --glow-blue: 0 0 20px #40c4ff33;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    min-height: 100vh;
    overscroll-behavior: none;
  }

  /* Scanline overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    pointer-events: none;
    z-index: 100;
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: 12px;
    padding-bottom: 24px;
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 10px;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--green), transparent);
    opacity: 0.6;
  }
  .header-left {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .header-title {
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 800;
    color: var(--green);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .header-subtitle {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }
  .status-dot {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 11px;
    color: var(--green);
  }
  .dot {
    width: 8px; height: 8px;
    background: var(--green);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--green); }
    50% { opacity: 0.5; box-shadow: 0 0 4px var(--green); }
  }
  .dot.offline { background: var(--red); box-shadow: 0 0 8px var(--red); }

  /* Last update */
  .last-update {
    text-align: center;
    font-size: 10px;
    color: var(--text-dim);
    margin-bottom: 10px;
    letter-spacing: 0.05em;
  }
  .last-update span { color: var(--text-mid); }

  /* Grid layout */
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
  }
  .grid-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
  }

  /* Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s;
  }
  .card:hover { border-color: var(--border-glow); }

  .card-label {
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .card-value {
    font-size: 22px;
    font-weight: 700;
    line-height: 1;
    color: var(--text);
  }
  .card-value.green { color: var(--green); }
  .card-value.blue  { color: var(--blue); }
  .card-value.amber { color: var(--amber); }
  .card-value.red   { color: var(--red); }
  .card-sub {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  /* Bar meter */
  .bar-wrap {
    background: var(--surface2);
    border-radius: 3px;
    height: 4px;
    margin-top: 8px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
  }
  .bar-fill.green { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .bar-fill.amber { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
  .bar-fill.red   { background: var(--red);   box-shadow: 0 0 6px var(--red); }
  .bar-fill.blue  { background: var(--blue);  box-shadow: 0 0 6px var(--blue); }

  /* Wide card */
  .card.wide {
    margin-bottom: 8px;
  }

  /* Section title */
  .section-title {
    font-size: 9px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 14px 0 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Traffic card */
  .traffic-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 8px;
  }
  .traffic-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 0;
    border-bottom: 1px solid var(--border);
  }
  .traffic-row:last-child { border-bottom: none; }
  .traffic-label { font-size: 11px; color: var(--text-mid); }
  .traffic-val   { font-size: 13px; font-weight: 500; }
  .traffic-val .arrow-down { color: var(--blue); }
  .traffic-val .arrow-up   { color: var(--green); }

  /* Peers table */
  .peers-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .peers-header {
    display: grid;
    grid-template-columns: 1fr 90px 70px;
    padding: 8px 12px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .peer-row {
    display: grid;
    grid-template-columns: 1fr 90px 70px;
    padding: 9px 12px;
    border-bottom: 1px solid var(--border);
    align-items: center;
    transition: background 0.15s;
  }
  .peer-row:last-child { border-bottom: none; }
  .peer-row:hover { background: var(--surface2); }
  .peer-name { font-size: 12px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .peer-hs   { font-size: 11px; color: var(--text-dim); }
  .peer-hs.online { color: var(--green); }
  .peer-hs.recent { color: var(--amber); }
  .peer-traffic { font-size: 10px; color: var(--text-dim); text-align: right; }

  /* Monthly chart */
  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 8px;
  }
  .chart-bars {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    height: 60px;
    margin: 12px 0 6px;
  }
  .chart-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    height: 100%;
    justify-content: flex-end;
  }
  .chart-bar {
    width: 100%;
    border-radius: 3px 3px 0 0;
    background: var(--blue-dim);
    border: 1px solid var(--blue);
    transition: height 0.8s cubic-bezier(0.4,0,0.2,1);
    position: relative;
  }
  .chart-bar.current {
    background: var(--green-mid);
    border-color: var(--green);
    box-shadow: 0 0 8px var(--green-dim);
  }
  .chart-month {
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }
  .chart-legend {
    display: flex;
    gap: 14px;
    font-size: 10px;
    color: var(--text-dim);
  }
  .legend-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 1px;
    margin-right: 4px;
    vertical-align: middle;
  }

  /* Peaks */
  .peak-row {
    display: flex;
    justify-content: space-between;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
    align-items: center;
  }
  .peak-row:last-child { border-bottom: none; }
  .peak-label { font-size: 11px; color: var(--text-mid); }
  .peak-val   { font-size: 13px; font-weight: 500; color: var(--amber); }

  /* Load avg */
  .load-bars {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    align-items: center;
  }
  .load-item {
    flex: 1;
    text-align: center;
  }
  .load-num {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .load-period {
    font-size: 9px;
    color: var(--text-dim);
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Skeleton shimmer */
  .skeleton {
    background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 4px;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* Fade in animation */
  .fade-in { animation: fadeIn 0.4s ease forwards; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

  /* Error state */
  .error-card {
    background: var(--red-dim);
    border: 1px solid var(--red);
    border-radius: 10px;
    padding: 16px;
    text-align: center;
    color: var(--red);
    font-size: 12px;
    margin-bottom: 8px;
  }

  /* Uptime badge */
  .uptime-tag {
    display: inline-block;
    padding: 2px 8px;
    background: var(--green-dim);
    border: 1px solid var(--green);
    border-radius: 20px;
    font-size: 11px;
    color: var(--green);
    margin-top: 4px;
  }
</style>
</head>
<body>
<div class="app" id="app">

  <div class="header">
    <div class="header-left">
      <div class="header-title">AWG Monitor</div>
      <div class="header-subtitle">AmneziaWG · Client Stats</div>
    </div>
    <div class="status-dot" id="status-indicator">
      <div class="dot" id="status-dot"></div>
      <span id="status-text">online</span>
    </div>
  </div>

  <div class="last-update" id="last-update">обновлено: <span>—</span></div>
  <div id="content"></div>

</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function fmtHandshake(sec) {
  if (!sec) return { text: "никогда", cls: "" };
  if (sec < 180)   return { text: sec + "с", cls: "online" };
  if (sec < 600)   return { text: Math.round(sec/60) + " мин", cls: "recent" };
  if (sec < 3600)  return { text: Math.round(sec/60) + " мин", cls: "" };
  if (sec < 86400) return { text: Math.round(sec/3600) + " ч", cls: "" };
  return { text: Math.round(sec/86400) + " д", cls: "" };
}
function barColor(pct) {
  if (pct > 85) return "red";
  if (pct > 65) return "amber";
  return "green";
}
function loadColor(v) {
  const n = parseFloat(v);
  if (n > 2.0) return "red";
  if (n > 1.0) return "amber";
  return "green";
}
function n(v, def=0) { return v !== undefined ? v : def; }

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render(d) {
  const isAdmin    = !!d.is_admin;
  const ramPct     = isAdmin ? Math.round(d.ram_used_mb / Math.max(d.ram_total_mb,1) * 100) : 0;
  const maxMonthly = (d.monthly && d.monthly.length) ? Math.max(...d.monthly.map(m => m.total_gb), 1) : 1;

  const awgDown = n(d.awg_current_down);
  const awgUp   = n(d.awg_current_up);
  const ethDown = n(d.eth_current_down);
  const ethUp   = n(d.eth_current_up);
  const overhead = Math.max(0, ethDown - awgDown).toFixed(2);

  // ── Блок сервера (только админ) ──────────────────────────────────────────────
  let html = isAdmin ? `
  <div class="grid-3">
    <div class="card fade-in">
      <div class="card-label">онлайн</div>
      <div class="card-value green">${d.peers_online}</div>
      <div class="card-sub">из ${d.peers_total}</div>
      <div class="bar-wrap"><div class="bar-fill green" style="width:${d.peers_total?Math.round(d.peers_online/d.peers_total*100):0}%"></div></div>
    </div>
    <div class="card fade-in" style="animation-delay:.05s">
      <div class="card-label">RAM</div>
      <div class="card-value ${barColor(ramPct)}">${ramPct}%</div>
      <div class="card-sub">${d.ram_used_mb} MB</div>
      <div class="bar-wrap"><div class="bar-fill ${barColor(ramPct)}" style="width:${ramPct}%"></div></div>
    </div>
    <div class="card fade-in" style="animation-delay:.1s">
      <div class="card-label">диск</div>
      <div class="card-value ${barColor(d.disk_pct)}">${d.disk_pct}%</div>
      <div class="card-sub">${d.disk_used}</div>
      <div class="bar-wrap"><div class="bar-fill ${barColor(d.disk_pct)}" style="width:${d.disk_pct}%"></div></div>
    </div>
  </div>
  <div class="card wide fade-in" style="animation-delay:.12s">
    <div class="card-label">Uptime · Load Average</div>
    <div class="uptime-tag">${d.uptime}</div>
    <div class="load-bars">
      ${d.load.map((v,i) => `<div class="load-item">
        <div class="load-num" style="color:var(--${loadColor(v)})">${v}</div>
        <div class="load-period">${[1,5,15][i]} мин</div>
      </div>`).join('')}
    </div>
  </div>` : `
  <div class="grid-2">
    <div class="card fade-in">
      <div class="card-label">онлайн клиентов</div>
      <div class="card-value green">${d.peers_online}</div>
      <div class="card-sub">из ${d.peers_total}</div>
    </div>
    <div class="card fade-in" style="animation-delay:.05s">
      <div class="card-label">uptime</div>
      <div class="card-value blue" style="font-size:14px">${d.uptime}</div>
    </div>
  </div>`;

  // ── Скорость клиентов сейчас (только админ) ──────────────────────────────────
  if (isAdmin) {
    html += `
  <div class="section-title">клиенты · скорость сейчас (awg0)</div>
  <div class="grid-2">
    <div class="card fade-in" style="animation-delay:.14s">
      <div class="card-label">↓ клиенты скачивают</div>
      <div class="card-value blue">${awgDown}</div>
      <div class="card-sub">Mbit/s</div>
    </div>
    <div class="card fade-in" style="animation-delay:.16s">
      <div class="card-label">↑ клиенты отдают</div>
      <div class="card-value green">${awgUp}</div>
      <div class="card-sub">Mbit/s</div>
    </div>
  </div>

  <div class="traffic-card fade-in" style="animation-delay:.18s">
    <div class="card-label" style="margin-bottom:8px">awg0 vs eth0 · сейчас</div>
    <div class="traffic-row">
      <div class="traffic-label">↓ клиенты скачивают (awg0)</div>
      <div class="traffic-val"><span class="arrow-down">${awgDown}</span> <span style="font-size:10px;color:var(--text-dim)">Mbit/s</span></div>
    </div>
    <div class="traffic-row">
      <div class="traffic-label">↓ сервер получает (eth0)</div>
      <div class="traffic-val"><span style="color:var(--text-mid)">${ethDown}</span> <span style="font-size:10px;color:var(--text-dim)">Mbit/s</span></div>
    </div>
    <div class="traffic-row">
      <div class="traffic-label" style="color:var(--text-dim)">overhead ↓ (eth − awg)</div>
      <div class="traffic-val" style="color:var(--amber)">${overhead} <span style="font-size:10px">Mbit/s</span></div>
    </div>
    <div class="traffic-row">
      <div class="traffic-label">↑ клиенты отдают (awg0)</div>
      <div class="traffic-val"><span class="arrow-up">${awgUp}</span> <span style="font-size:10px;color:var(--text-dim)">Mbit/s</span></div>
    </div>
    <div class="traffic-row">
      <div class="traffic-label">↑ сервер отдаёт (eth0)</div>
      <div class="traffic-val"><span style="color:var(--text-mid)">${ethUp}</span> <span style="font-size:10px;color:var(--text-dim)">Mbit/s</span></div>
    </div>
  </div>

  <div class="section-title">пики клиентов (awg0)</div>
  <div class="traffic-card fade-in" style="animation-delay:.2s">
    <div class="traffic-row">
      <div class="traffic-label">🏅 пик сегодня · клиенты</div>
      <div class="traffic-val">
        <span class="arrow-down">↓${n(d.awg_peak_day?.down)}</span>
        <span class="arrow-up"> ↑${n(d.awg_peak_day?.up)}</span>
        <span style="font-size:10px;color:var(--text-dim)"> Mbit/s</span>
      </div>
    </div>
    <div class="traffic-row">
      <div class="traffic-label" style="color:var(--text-dim)">  сервер сегодня</div>
      <div class="traffic-val" style="font-size:11px;color:var(--text-dim)">
        ↓${n(d.eth_peak_day?.down)} ↑${n(d.eth_peak_day?.up)} Mbit/s
      </div>
    </div>
    <div class="traffic-row">
      <div class="traffic-label">🏆 пик за всё время · клиенты</div>
      <div class="traffic-val">
        <span class="arrow-down">↓${n(d.awg_peak_all?.down)}</span>
        <span class="arrow-up"> ↑${n(d.awg_peak_all?.up)}</span>
        <span style="font-size:10px;color:var(--text-dim)"> Mbit/s</span>
      </div>
    </div>
    <div class="traffic-row">
      <div class="traffic-label" style="color:var(--text-dim)">  сервер за всё время</div>
      <div class="traffic-val" style="font-size:11px;color:var(--text-dim)">
        ↓${n(d.eth_peak_all?.down)} ↑${n(d.eth_peak_all?.up)} Mbit/s
      </div>
    </div>
    <div class="traffic-row">
      <div class="traffic-label">📶 всего скачали (с рест.)</div>
      <div class="traffic-val" style="color:var(--blue)">${d.clients_total_download}</div>
    </div>
    <div class="traffic-row">
      <div class="traffic-label">📶 всего отдали (с рест.)</div>
      <div class="traffic-val" style="color:var(--green)">${d.clients_total_upload}</div>
    </div>
  </div>`;

    // Топ-5 минут
    if (d.bw_top && d.bw_top.length) {
      html += `
  <div class="section-title">топ-5 нагруженных минут</div>
  <div class="traffic-card fade-in" style="animation-delay:.22s">
    ${d.bw_top.map(r => `
    <div class="traffic-row">
      <div class="traffic-label" style="font-size:10px">${r.dt}</div>
      <div class="traffic-val" style="font-size:11px">
        <span class="arrow-down">↓${r.awg_down}</span>
        <span class="arrow-up"> ↑${r.awg_up}</span>
        <span style="color:var(--text-dim);font-size:10px"> / сервер ↓${r.eth_down} ↑${r.eth_up} Mbit</span>
      </div>
    </div>`).join('')}
  </div>`;
    }

    // Месячный трафик сервера
    html += `
  <div class="section-title">трафик сервера · eth0 · лимит провайдера</div>
  <div class="chart-card fade-in" style="animation-delay:.24s">
    <div class="chart-bars">
      ${d.monthly.map(m => {
        const h = Math.max(6, Math.round(m.total_gb / maxMonthly * 56));
        return '<div class="chart-col">' +
          '<div class="chart-bar ' + (m.current?'current':'') + '" style="height:' + h + 'px" title="' + m.total_gb + ' GB"></div>' +
          '<div class="chart-month">' + m.label.slice(5) + '</div>' +
          '</div>';
      }).join('')}
    </div>
    <div class="chart-legend">
      <div><span class="legend-dot" style="background:var(--blue);border:1px solid var(--blue)"></span>прошлые</div>
      <div><span class="legend-dot" style="background:var(--green-mid);border:1px solid var(--green)"></span>текущий</div>
    </div>
    <div style="margin-top:10px">
      ${d.monthly.map(m =>
        '<div class="traffic-row">' +
          '<div class="traffic-label">' + m.label + '</div>' +
          '<div class="traffic-val" style="color:' + (m.current?'var(--green)':'var(--text-mid)') + '">' +
            '<span class="arrow-down">↓' + m.rx_gb + '</span>' +
            ' <span class="arrow-up">↑' + m.tx_gb + '</span>' +
            ' = ' + (m.total_gb >= 1000 ? (m.total_gb/1000).toFixed(2)+' TB' : m.total_gb+' GB') +
            (m.current ? ' <span style="color:var(--text-dim);font-size:10px">◀</span>' : '') +
          '</div>' +
        '</div>'
      ).join('')}
    </div>
  </div>`;
  }

  // ── Таблица устройств (для всех) ─────────────────────────────────────────────
  if (d.peers && d.peers.length) {
    html += `
  <div class="section-title">устройства</div>
  <div class="peers-card fade-in" style="animation-delay:.26s">
    <div class="peers-header">
      <div>устройство</div>
      <div>хэндшейк</div>
      <div style="text-align:right">трафик</div>
    </div>
    ${d.peers.map(p => {
      const hs = fmtHandshake(p.handshake);
      return '<div class="peer-row">' +
        '<div class="peer-name">' + p.name + '</div>' +
        '<div class="peer-hs ' + hs.cls + '">' + hs.text + '</div>' +
        '<div class="peer-traffic">↓' + p.client_download + '<br>↑' + p.client_upload + '</div>' +
        '</div>';
    }).join('')}
  </div>`;
  }

  document.getElementById('content').innerHTML = html;

  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('status-text');
  if (d.awg_status === 'running') {
    dot.classList.remove('offline'); txt.textContent = 'online';
  } else {
    dot.classList.add('offline'); txt.textContent = 'offline';
  }
  document.querySelector('#last-update span').textContent =
    new Date().toLocaleTimeString('ru', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}

// ─── LOAD ─────────────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const resp = await fetch("/api/stats", {
      headers: { "X-Init-Data": tg?.initData || "" }
    });
    if (resp.status === 401) {
      document.getElementById('content').innerHTML =
        '<div class="error-card">⛔ Нет доступа<br><span style="font-size:10px;opacity:0.7">Откройте через Telegram-бота</span></div>';
      return;
    }
    if (resp.status === 403) {
      document.getElementById('content').innerHTML =
        '<div class="error-card">⛔ Нет доступа<br><span style="font-size:10px;opacity:0.7">Вы не зарегистрированы</span></div>';
      return;
    }
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    render(await resp.json());
  } catch(e) {
    document.getElementById('content').innerHTML =
      '<div class="error-card">⚠ Нет связи<br><span style="font-size:10px;opacity:0.7">' + e.message + '</span></div>';
  }
}

loadData();
setInterval(loadData, 5000);
</script>
</body>
</html>
