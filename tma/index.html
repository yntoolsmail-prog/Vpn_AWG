<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<title>AWG Monitor</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;700;800&display=swap');

  :root {
    --bg: #080b0e;
    --surface: #0f1318;
    --surface2: #161c24;
    --border: #253040;
    --border-hi: #3a4d62;
    --green: #00f080;
    --green-dim: #00f08018;
    --green-mid: #00f08044;
    --blue: #48cfff;
    --blue-dim: #48cfff18;
    --amber: #ffc040;
    --amber-dim: #ffc04018;
    --red: #ff5555;
    --red-dim: #ff555518;
    --text: #dce8f2;
    --text-dim: #4e6070;
    --text-mid: #8faabb;
    --nav-h: 62px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 15px;
    min-height: 100vh;
    overscroll-behavior: none;
  }

  /* Scanline overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.02) 3px, rgba(0,0,0,0.02) 6px);
    pointer-events: none;
    z-index: 200;
  }

  .app {
    max-width: 480px;
    margin: 0 auto;
    padding: 12px 12px calc(var(--nav-h) + 12px);
  }

  /* ── Pages ── */
  .page { display: none; }
  .page.active { display: block; animation: fadeIn .2s ease; }

  /* Admin-only: скрыто пока не подтверждена роль */
  .is-admin .admin-only { display: flex; }
  .is-admin .page.admin-only { display: none; }
  .is-admin .page.admin-only.active { display: block; }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    margin-bottom: 10px;
    position: relative;
    overflow: hidden;
  }
  .header::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--green), transparent);
    opacity: 0.6;
  }
  .header-left {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .header-title {
    font-family: 'Syne', sans-serif;
    font-size: 18px;
    font-weight: 800;
    color: var(--green);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .header-subtitle {
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }
  .status-dot {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--green);
  }
  .dot {
    width: 9px; height: 9px;
    background: var(--green);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--green);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 8px var(--green); }
    50% { opacity: 0.5; box-shadow: 0 0 4px var(--green); }
  }
  .dot.offline { background: var(--red); box-shadow: 0 0 8px var(--red); }

  /* Last update */
  .last-update {
    text-align: center;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 10px;
    letter-spacing: 0.05em;
  }
  .last-update span { color: var(--text-mid); }

  /* Grid layout */
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
  }
  .grid-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 8px;
    margin-bottom: 8px;
  }

  /* Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    position: relative;
    overflow: hidden;
    transition: border-color 0.3s;
  }
  .card:hover { border-color: var(--border-glow); }

  .card-label {
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .card-value {
    font-size: 26px;
    font-weight: 700;
    line-height: 1;
    color: var(--text);
  }
  .card-value.green { color: var(--green); }
  .card-value.blue  { color: var(--blue); }
  .card-value.amber { color: var(--amber); }
  .card-value.red   { color: var(--red); }
  .card-sub {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  /* Bar meter */
  .bar-wrap {
    background: var(--surface2);
    border-radius: 3px;
    height: 4px;
    margin-top: 8px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.8s cubic-bezier(0.4,0,0.2,1);
  }
  .bar-fill.green { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .bar-fill.amber { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
  .bar-fill.red   { background: var(--red);   box-shadow: 0 0 6px var(--red); }
  .bar-fill.blue  { background: var(--blue);  box-shadow: 0 0 6px var(--blue); }

  /* Wide card */
  .card.wide {
    margin-bottom: 8px;
  }

  /* Section title */
  .section-title {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin: 14px 0 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Traffic card */
  .traffic-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 8px;
  }
  .traffic-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 5px 0;
    border-bottom: 1px solid var(--border);
  }
  .traffic-row:last-child { border-bottom: none; }
  .traffic-label { font-size: 12px; color: var(--text-mid); }
  .traffic-val   { font-size: 14px; font-weight: 500; }
  .traffic-val .arrow-down { color: var(--blue); }
  .traffic-val .arrow-up   { color: var(--green); }

  /* Peers table */
  .peers-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 8px;
  }
  .peers-header {
    display: grid;
    grid-template-columns: 1fr 90px 75px;
    padding: 8px 12px;
    background: var(--surface2);
    border-bottom: 1px solid var(--border);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
  }
  .peer-row {
    display: grid;
    grid-template-columns: 1fr 90px 75px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    align-items: center;
    transition: background 0.15s;
  }
  .peer-row:last-child { border-bottom: none; }
  .peer-row:hover { background: var(--surface2); }
  .peer-name { font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .peer-hs   { font-size: 12px; color: var(--text-dim); }
  .peer-hs.online { color: var(--green); }
  .peer-hs.recent { color: var(--amber); }
  .peer-traffic { font-size: 11px; color: var(--text-dim); text-align: right; }

  /* Monthly chart */
  .chart-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 8px;
  }
  .chart-bars {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    height: 60px;
    margin: 12px 0 6px;
  }
  .chart-col {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    height: 100%;
    justify-content: flex-end;
  }
  .chart-bar {
    width: 100%;
    border-radius: 3px 3px 0 0;
    background: var(--blue-dim);
    border: 1px solid var(--blue);
    transition: height 0.8s cubic-bezier(0.4,0,0.2,1);
    position: relative;
  }
  .chart-bar.current {
    background: var(--green-mid);
    border-color: var(--green);
    box-shadow: 0 0 8px var(--green-dim);
  }
  .chart-month {
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
  }
  .chart-legend {
    display: flex;
    gap: 14px;
    font-size: 10px;
    color: var(--text-dim);
  }
  .legend-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 1px;
    margin-right: 4px;
    vertical-align: middle;
  }

  /* Peaks */
  .peak-row {
    display: flex;
    justify-content: space-between;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
    align-items: center;
  }
  .peak-row:last-child { border-bottom: none; }
  .peak-label { font-size: 11px; color: var(--text-mid); }
  .peak-val   { font-size: 13px; font-weight: 500; color: var(--amber); }

  /* Load avg */
  .load-bars {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    align-items: center;
  }
  .load-item {
    flex: 1;
    text-align: center;
  }
  .load-num {
    font-size: 15px;
    font-weight: 700;
    margin-bottom: 4px;
  }
  .load-period {
    font-size: 9px;
    color: var(--text-dim);
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Skeleton shimmer */
  .skeleton {
    background: linear-gradient(90deg, var(--surface2) 25%, var(--border) 50%, var(--surface2) 75%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 4px;
  }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* Fade in animation */
  .fade-in { animation: fadeIn 0.4s ease forwards; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

  /* Error state */
  .error-card {
    background: var(--red-dim);
    border: 1px solid var(--red);
    border-radius: 10px;
    padding: 16px;
    text-align: center;
    color: var(--red);
    font-size: 12px;
    margin-bottom: 8px;
  }

  /* Uptime badge */
  .uptime-tag {
    display: inline-block;
    padding: 2px 10px;
    background: var(--green-dim);
    border: 1px solid var(--green);
    border-radius: 20px;
    font-size: 12px;
    color: var(--green);
    margin-top: 4px;
  }

  /* ── Bottom Nav ── */
  .nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    height: var(--nav-h);
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    z-index: 100;
    padding-bottom: env(safe-area-inset-bottom, 0);
  }
  .nav-item {
    flex: 1; display: none; flex-direction: column;
    align-items: center; justify-content: center; gap: 3px;
    cursor: pointer; color: var(--text-dim);
    font-size: 10px; letter-spacing: .05em;
    user-select: none; transition: color .15s;
    position: relative; padding: 8px 4px;
  }
  /* Первые два таба (monitor, devices) всегда видны */
  .nav-item:nth-child(1),
  .nav-item:nth-child(2) { display: flex; }
  .nav-item.active { color: var(--green); }
  .nav-icon { font-size: 20px; line-height: 1; }
  .nav-badge {
    position: absolute; top: 6px; right: calc(50% - 18px);
    background: var(--amber); color: #000;
    font-size: 9px; font-weight: 700;
    min-width: 16px; height: 16px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    padding: 0 4px;
  }

  /* ── FAB ── */
  .fab {
    position: fixed; right: 16px; bottom: calc(var(--nav-h) + 14px);
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--green); color: var(--bg);
    display: none; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 300; line-height: 1;
    box-shadow: 0 0 20px #00f08044;
    cursor: pointer; border: none;
    transition: transform .15s;
    z-index: 50;
  }
  .fab:active { transform: scale(.94); }

  /* ── Placeholder (заглушки будущих страниц) ── */
  .placeholder {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 220px; gap: 10px;
    color: var(--text-dim); font-size: 13px; text-align: center;
    border: 1px dashed var(--border); border-radius: 12px;
    padding: 32px; margin-top: 8px;
  }
  .placeholder-icon { font-size: 40px; opacity: .4; }
</style>
</head>
<body>
<div class="app">

  <!-- ══ МОНИТОР ══ -->
  <div class="page active" id="page-monitor">
    <div class="header">
      <div class="header-left">
        <div class="header-title">AWG Monitor</div>
        <div class="header-subtitle">AmneziaWG · Client Stats</div>
      </div>
      <div class="status-dot" id="status-indicator">
        <div class="dot" id="status-dot"></div>
        <span id="status-text">online</span>
      </div>
    </div>
    <div class="last-update" id="last-update">обновлено: <span>—</span></div>
    <div id="content"></div>
  </div>

  <!-- ══ УСТРОЙСТВА ══ -->
  <div class="page" id="page-devices">
    <div class="header">
      <div class="header-left">
        <div class="header-title">Устройства</div>
        <div class="header-subtitle" id="dev-subtitle">мои устройства</div>
      </div>
    </div>
    <div id="devices-content">
      <div class="placeholder">
        <div class="placeholder-icon">📱</div>
        <div>Загрузка...</div>
      </div>
    </div>
  </div>

  <!-- ══ ПОЛЬЗОВАТЕЛИ (admin) ══ -->
  <div class="page admin-only" id="page-users">
    <div class="header">
      <div class="header-left">
        <div class="header-title">Пользователи</div>
        <div class="header-subtitle" id="users-subtitle">управление доступом</div>
      </div>
    </div>
    <div id="users-content">
      <div class="placeholder">
        <div class="placeholder-icon">👥</div>
        <div>Загрузка...</div>
      </div>
    </div>
  </div>

  <!-- ══ НАСТРОЙКИ (admin) ══ -->
  <div class="page admin-only" id="page-settings">
    <div class="header">
      <div class="header-left">
        <div class="header-title">Настройки</div>
        <div class="header-subtitle">сервер · обслуживание · бэкапы</div>
      </div>
    </div>
    <div id="settings-content">
      <div class="placeholder">
        <div class="placeholder-icon">⚙️</div>
        <div>Загрузка...</div>
      </div>
    </div>
  </div>

</div><!-- .app -->

<!-- ── FAB ── -->
<button class="fab" id="fab">+</button>

<!-- ── BOTTOM NAV ── -->
<nav class="nav">
  <div class="nav-item active" id="nav-monitor" onclick="goto('monitor')">
    <span class="nav-icon">📊</span>
    <span>Монитор</span>
  </div>
  <div class="nav-item" id="nav-devices" onclick="goto('devices')">
    <span class="nav-icon">📱</span>
    <span>Устройства</span>
  </div>
  <div class="nav-item admin-only" id="nav-users" onclick="goto('users')">
    <span class="nav-icon">👥</span>
    <span>Юзеры</span>
  </div>
  <div class="nav-item admin-only" id="nav-settings" onclick="goto('settings')">
    <span class="nav-icon">⚙️</span>
    <span>Настройки</span>
  </div>
</nav>

<script>
// ─── INIT ─────────────────────────────────────────────────────────────────────
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const INIT_DATA = tg?.initData || '';
const API = (path, opts = {}) => fetch(path, {
  headers: { 'X-Init-Data': INIT_DATA, 'Content-Type': 'application/json', ...(opts.headers || {}) },
  ...opts,
});

// ─── NAVIGATION ───────────────────────────────────────────────────────────────
let currentTab = 'monitor';
const _loaded = {};  // какие страницы уже загружались

function goto(tab) {
  if (currentTab === tab) return;
  currentTab = tab;
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.getElementById('page-' + tab).classList.add('active');
  document.getElementById('nav-' + tab).classList.add('active');
  document.getElementById('fab').style.display = (tab === 'devices') ? 'flex' : 'none';
  if (!_loaded[tab]) { _loaded[tab] = true; _pageLoad(tab); }
}

function _pageLoad(tab) {
  if (tab === 'devices')  loadDevices();
  if (tab === 'users')    loadUsers();
  if (tab === 'settings') loadSettings();
}

function revealAdminUI() {
  // Показываем admin-only nav-items и pages (pages управляются .page.active)
  document.querySelectorAll('.nav-item.admin-only').forEach(el => el.style.display = 'flex');
}

function setBadge(navId, count) {
  const item = document.getElementById(navId);
  if (!item) return;
  let badge = item.querySelector('.nav-badge');
  if (count > 0) {
    if (!badge) { badge = document.createElement('span'); badge.className = 'nav-badge'; item.appendChild(badge); }
    badge.textContent = count;
    badge.style.display = 'flex';
  } else if (badge) {
    badge.style.display = 'none';
  }
}

// ─── STUBS (реализуются в этапах 3–5) ────────────────────────────────────────
async function loadDevices()  { /* этап 3 */ }
async function loadUsers()    { /* этап 4 */ }
async function loadSettings() { /* этап 5 */ }


// ─── HELPERS ──────────────────────────────────────────────────────────────────
function fmtHandshake(sec) {
  if (!sec) return { text: "никогда", cls: "" };
  if (sec < 180)   return { text: sec + "с", cls: "online" };
  if (sec < 600)   return { text: Math.round(sec/60) + " мин", cls: "recent" };
  if (sec < 3600)  return { text: Math.round(sec/60) + " мин", cls: "" };
  if (sec < 86400) return { text: Math.round(sec/3600) + " ч", cls: "" };
  return { text: Math.round(sec/86400) + " д", cls: "" };
}
function barColor(pct) {
  if (pct > 85) return "red";
  if (pct > 65) return "amber";
  return "green";
}
function loadColor(v) {
  const n = parseFloat(v);
  if (n > 2.0) return "red";
  if (n > 1.0) return "amber";
  return "green";
}
function n(v, def=0) { return v !== undefined ? v : def; }

function setEl(id, val) {
  const el = document.getElementById(id);
  if (el) el.textContent = val;
}
function setStyle(id, prop, val) {
  const el = document.getElementById(id);
  if (el) el.style[prop] = val;
}
function setClass(id, cls) {
  const el = document.getElementById(id);
  if (el) el.className = cls;
}

// ─── BUILD DOM (первый рендер) ─────────────────────────────────────────────────
function buildDOM(d) {
  const isAdmin = !!d.is_admin;
  let html = '';

  if (isAdmin) {
    html += `
  <div class="grid-3">
    <div class="card">
      <div class="card-label">онлайн</div>
      <div class="card-value green" id="v-online">—</div>
      <div class="card-sub" id="v-online-sub">из —</div>
      <div class="bar-wrap"><div class="bar-fill green" id="b-online" style="width:0%"></div></div>
    </div>
    <div class="card">
      <div class="card-label">RAM</div>
      <div class="card-value" id="v-ram">—</div>
      <div class="card-sub" id="v-ram-sub">— MB</div>
      <div class="bar-wrap"><div class="bar-fill" id="b-ram" style="width:0%"></div></div>
    </div>
    <div class="card">
      <div class="card-label">диск</div>
      <div class="card-value" id="v-disk">—</div>
      <div class="card-sub" id="v-disk-sub">—</div>
      <div class="bar-wrap"><div class="bar-fill" id="b-disk" style="width:0%"></div></div>
    </div>
  </div>
  <div class="card wide">
    <div class="card-label">Uptime · Load Average</div>
    <div class="uptime-tag" id="v-uptime">—</div>
    <div class="load-bars" id="v-load"></div>
  </div>
  <div class="section-title">клиенты · скорость сейчас (awg0)</div>
  <div class="grid-2">
    <div class="card">
      <div class="card-label">↓ клиенты скачивают</div>
      <div class="card-value blue" id="v-awg-down">—</div>
      <div class="card-sub">Mbit/s</div>
    </div>
    <div class="card">
      <div class="card-label">↑ клиенты отдают</div>
      <div class="card-value green" id="v-awg-up">—</div>
      <div class="card-sub">Mbit/s</div>
    </div>
  </div>
  <div class="traffic-card">
    <div class="card-label" style="margin-bottom:8px">awg0 vs eth0 · сейчас</div>
    <div class="traffic-row"><div class="traffic-label">↓ клиенты скачивают (awg0)</div><div class="traffic-val"><span class="arrow-down" id="v-t-awgdown">—</span> <span style="font-size:10px;color:var(--text-dim)">Mbit/s</span></div></div>
    <div class="traffic-row"><div class="traffic-label">↓ сервер получает (eth0)</div><div class="traffic-val"><span style="color:var(--text-mid)" id="v-t-ethdown">—</span> <span style="font-size:10px;color:var(--text-dim)">Mbit/s</span></div></div>
    <div class="traffic-row"><div class="traffic-label" style="color:var(--text-dim)">overhead ↓ (eth − awg)</div><div class="traffic-val" style="color:var(--amber)" id="v-t-overhead">— <span style="font-size:10px">Mbit/s</span></div></div>
    <div class="traffic-row"><div class="traffic-label">↑ клиенты отдают (awg0)</div><div class="traffic-val"><span class="arrow-up" id="v-t-awgup">—</span> <span style="font-size:10px;color:var(--text-dim)">Mbit/s</span></div></div>
    <div class="traffic-row"><div class="traffic-label">↑ сервер отдаёт (eth0)</div><div class="traffic-val"><span style="color:var(--text-mid)" id="v-t-ethup">—</span> <span style="font-size:10px;color:var(--text-dim)">Mbit/s</span></div></div>
  </div>
  <div class="section-title">пики клиентов (awg0)</div>
  <div class="traffic-card">
    <div class="traffic-row"><div class="traffic-label">🏅 пик сегодня · клиенты</div><div class="traffic-val"><span class="arrow-down" id="v-pk-day-down">—</span> <span class="arrow-up" id="v-pk-day-up">—</span> <span style="font-size:10px;color:var(--text-dim)">Mbit/s</span></div></div>
    <div class="traffic-row"><div class="traffic-label" style="color:var(--text-dim)">  сервер сегодня</div><div class="traffic-val" style="font-size:11px;color:var(--text-dim)" id="v-pk-day-eth">—</div></div>
    <div class="traffic-row"><div class="traffic-label">🏆 пик за всё время · клиенты</div><div class="traffic-val"><span class="arrow-down" id="v-pk-all-down">—</span> <span class="arrow-up" id="v-pk-all-up">—</span> <span style="font-size:10px;color:var(--text-dim)">Mbit/s</span></div></div>
    <div class="traffic-row"><div class="traffic-label" style="color:var(--text-dim)">  сервер за всё время</div><div class="traffic-val" style="font-size:11px;color:var(--text-dim)" id="v-pk-all-eth">—</div></div>
    <div class="traffic-row"><div class="traffic-label">📶 всего скачали (с рест.)</div><div class="traffic-val" style="color:var(--blue)" id="v-total-dl">—</div></div>
    <div class="traffic-row"><div class="traffic-label">📶 всего отдали (с рест.)</div><div class="traffic-val" style="color:var(--green)" id="v-total-ul">—</div></div>
  </div>
  <div class="section-title">топ-5 нагруженных минут</div>
  <div class="traffic-card" id="v-bwtop"></div>
  <div class="section-title">трафик сервера · eth0 · лимит провайдера</div>
  <div class="chart-card">
    <div class="chart-bars" id="v-chart-bars"></div>
    <div class="chart-legend">
      <div><span class="legend-dot" style="background:var(--blue);border:1px solid var(--blue)"></span>прошлые</div>
      <div><span class="legend-dot" style="background:var(--green-mid);border:1px solid var(--green)"></span>текущий</div>
    </div>
    <div style="margin-top:10px" id="v-monthly-list"></div>
  </div>`;
  } else {
    html += `
  <div class="grid-2">
    <div class="card">
      <div class="card-label">онлайн клиентов</div>
      <div class="card-value green" id="v-online">—</div>
      <div class="card-sub" id="v-online-sub">из —</div>
    </div>
    <div class="card">
      <div class="card-label">uptime</div>
      <div class="card-value blue" style="font-size:14px" id="v-uptime">—</div>
    </div>
  </div>`;
  }

  html += `
  <div class="section-title">устройства</div>
  <div class="peers-card">
    <div class="peers-header"><div>устройство</div><div>хэндшейк</div><div style="text-align:right">трафик</div></div>
    <div id="v-peers"></div>
  </div>`;

  document.getElementById('content').innerHTML = html;
}

// ─── UPDATE VALUES (последующие рендеры) ──────────────────────────────────────
function updateValues(d) {
  const isAdmin = !!d.is_admin;
  const ramPct  = isAdmin ? Math.round(d.ram_used_mb / Math.max(d.ram_total_mb,1) * 100) : 0;
  const awgDown = n(d.awg_current_down);
  const awgUp   = n(d.awg_current_up);
  const ethDown = n(d.eth_current_down);
  const ethUp   = n(d.eth_current_up);
  const overhead = Math.max(0, ethDown - awgDown).toFixed(2);

  // Онлайн
  setEl('v-online', d.peers_online);
  setEl('v-online-sub', 'из ' + d.peers_total);

  // Uptime
  setEl('v-uptime', d.uptime);

  if (isAdmin) {
    // RAM
    const ramColor = barColor(ramPct);
    setEl('v-ram', ramPct + '%');
    setEl('v-ram-sub', d.ram_used_mb + ' MB');
    setClass('v-ram', 'card-value ' + ramColor);
    const bRam = document.getElementById('b-ram');
    if (bRam) { bRam.style.width = ramPct + '%'; bRam.className = 'bar-fill ' + ramColor; }

    // Диск
    const diskColor = barColor(d.disk_pct);
    setEl('v-disk', d.disk_pct + '%');
    setEl('v-disk-sub', d.disk_used);
    setClass('v-disk', 'card-value ' + diskColor);
    const bDisk = document.getElementById('b-disk');
    if (bDisk) { bDisk.style.width = d.disk_pct + '%'; bDisk.className = 'bar-fill ' + diskColor; }

    // Онлайн bar
    const bOnline = document.getElementById('b-online');
    if (bOnline) bOnline.style.width = (d.peers_total ? Math.round(d.peers_online/d.peers_total*100) : 0) + '%';

    // Load
    const loadEl = document.getElementById('v-load');
    if (loadEl && d.load) {
      loadEl.innerHTML = d.load.map((v,i) =>
        `<div class="load-item"><div class="load-num" style="color:var(--${loadColor(v)})">${v}</div><div class="load-period">${[1,5,15][i]} мин</div></div>`
      ).join('');
    }

    // Скорость
    setEl('v-awg-down', awgDown); setEl('v-awg-up', awgUp);
    setEl('v-t-awgdown', awgDown); setEl('v-t-awgup', awgUp);
    setEl('v-t-ethdown', ethDown); setEl('v-t-ethup', ethUp);
    setEl('v-t-overhead', overhead + ' Mbit/s');

    // Пики
    setEl('v-pk-day-down', '↓' + n(d.awg_peak_day?.down));
    setEl('v-pk-day-up',   '↑' + n(d.awg_peak_day?.up));
    setEl('v-pk-day-eth',  '↓' + n(d.eth_peak_day?.down) + ' ↑' + n(d.eth_peak_day?.up) + ' Mbit/s');
    setEl('v-pk-all-down', '↓' + n(d.awg_peak_all?.down));
    setEl('v-pk-all-up',   '↑' + n(d.awg_peak_all?.up));
    setEl('v-pk-all-eth',  '↓' + n(d.eth_peak_all?.down) + ' ↑' + n(d.eth_peak_all?.up) + ' Mbit/s');
    setEl('v-total-dl', d.clients_total_download || '—');
    setEl('v-total-ul', d.clients_total_upload   || '—');

    // Топ-5
    const topEl = document.getElementById('v-bwtop');
    if (topEl && d.bw_top) {
      topEl.innerHTML = d.bw_top.map(r =>
        `<div class="traffic-row">
          <div class="traffic-label" style="font-size:10px">${r.dt}</div>
          <div class="traffic-val" style="font-size:11px">
            <span class="arrow-down">↓${r.awg_down}</span>
            <span class="arrow-up"> ↑${r.awg_up}</span>
            <span style="color:var(--text-dim);font-size:10px"> / сервер ↓${r.eth_down} ↑${r.eth_up} Mbit</span>
          </div>
        </div>`
      ).join('');
    }

    // Месячный трафик
    if (d.monthly && d.monthly.length) {
      const maxM = Math.max(...d.monthly.map(m => m.total_gb), 1);
      const barsEl = document.getElementById('v-chart-bars');
      if (barsEl) {
        barsEl.innerHTML = d.monthly.map(m => {
          const h = Math.max(6, Math.round(m.total_gb / maxM * 56));
          return `<div class="chart-col"><div class="chart-bar ${m.current?'current':''}" style="height:${h}px" title="${m.total_gb} GB"></div><div class="chart-month">${m.label.slice(5)}</div></div>`;
        }).join('');
      }
      const listEl = document.getElementById('v-monthly-list');
      if (listEl) {
        listEl.innerHTML = d.monthly.map(m =>
          `<div class="traffic-row">
            <div class="traffic-label">${m.label}</div>
            <div class="traffic-val" style="color:${m.current?'var(--green)':'var(--text-mid)'}">
              <span class="arrow-down">↓${m.rx_gb}</span> <span class="arrow-up">↑${m.tx_gb}</span>
              = ${m.total_gb >= 1000 ? (m.total_gb/1000).toFixed(2)+' TB' : m.total_gb+' GB'}
              ${m.current ? '<span style="color:var(--text-dim);font-size:10px">◀</span>' : ''}
            </div>
          </div>`
        ).join('');
      }
    }
  }

  // Устройства
  const peersEl = document.getElementById('v-peers');
  if (peersEl && d.peers) {
    peersEl.innerHTML = d.peers.map(p => {
      const hs = fmtHandshake(p.handshake);
      return `<div class="peer-row">
        <div class="peer-name">${p.name}</div>
        <div class="peer-hs ${hs.cls}">${hs.text}</div>
        <div class="peer-traffic">↓${p.client_download}<br>↑${p.client_upload}</div>
      </div>`;
    }).join('');
  }
}

// ─── RENDER (умный: первый раз строит, потом обновляет) ───────────────────────
let domBuilt = false;
let lastIsAdmin = null;

function render(d) {
  if (!domBuilt || lastIsAdmin !== d.is_admin) {
    buildDOM(d);
    domBuilt = true;
    lastIsAdmin = d.is_admin;
    if (d.is_admin) revealAdminUI();
  }
  updateValues(d);

  const dot = document.getElementById('status-dot');
  const txt = document.getElementById('status-text');
  if (d.awg_status === 'running') {
    dot.classList.remove('offline'); txt.textContent = 'online';
  } else {
    dot.classList.add('offline'); txt.textContent = 'offline';
  }
  document.querySelector('#last-update span').textContent =
    new Date().toLocaleTimeString('ru', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}

// ─── LOAD ─────────────────────────────────────────────────────────────────────
async function loadData() {
  if (currentTab !== 'monitor') return;
  try {
    const resp = await API('/api/stats');
    if (resp.status === 401) {
      document.getElementById('content').innerHTML =
        '<div class="error-card">⛔ Нет доступа<br><span style="font-size:11px;opacity:0.7">Откройте через Telegram-бота</span></div>';
      return;
    }
    if (resp.status === 403) {
      document.getElementById('content').innerHTML =
        '<div class="error-card">⛔ Аккаунт не зарегистрирован<br><span style="font-size:11px;opacity:0.7">Отправьте /start боту</span></div>';
      return;
    }
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    render(await resp.json());
  } catch(e) {
    document.getElementById('content').innerHTML =
      '<div class="error-card">⚠ Нет связи<br><span style="font-size:11px;opacity:0.7">' + e.message + '</span></div>';
  }
}

loadData();
setInterval(loadData, 5000);
</script>

</body>
</html>
